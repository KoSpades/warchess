<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warchess — plotting table</title>
<style>
:root{
  --ink:#131A21; --panel:#1A232C; --panel-2:#202B35; --chart:#303E48;
  --rule:#2E3D49; --rule-soft:#2F3D48;
  --verdigris:#57A08E; --brass:#C99A3E; --oxide:#D8564A; --ember:#D2622F;
  --text:#DCE4E8; --dim:#7C8B95; --dimmer:#4E5F6B;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans SC","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);font-family:var(--sans)}
body{height:100vh;overflow:hidden;font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:600}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.35}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* ---------- frame ---------- */
header{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;font-size:12px}
.brand b{color:var(--verdigris);font-weight:600}
.sidebadge{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 9px;border:1px solid currentColor;border-radius:2px}
.sideL{color:var(--verdigris)} .sideR{color:var(--brass)}
.clock{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.clock b{color:var(--text);font-weight:600}

/* The page itself never scrolls. main owns all the viewport height below the
   header; the board takes the left, and the right column stacks the order panel
   over the info panel, each scrolling inside itself. --chrome is the header plus
   main's own padding. --rsplit is how the right column divides between them. */
:root{--rpanel:344px; --chrome:72px; --rsplit:1.15fr;
  /* The board's own size, worked out once so the right column can match its
     height exactly instead of stretching past the bottom row. Cells are 5:6 and
     the grid is 9x5 with 4px gaps, so height = width*2/3 - 5.34px. */
  --boardw:min(calc(100vw - 28px - var(--rpanel)), calc((100vh - var(--chrome) - 20px) * 1.5));
  --boardh:calc(var(--boardw) * 2 / 3 - 5.34px)}
main{display:grid;grid-template-columns:minmax(0,1fr) var(--rpanel);
  gap:8px;padding:10px;height:calc(100vh - var(--chrome));overflow:hidden}
.rightcol{display:grid;grid-template-rows:var(--rsplit) 1fr;gap:8px;min-height:0;
  height:var(--boardh);align-self:start}
.panel{display:flex;flex-direction:column;max-height:100%;min-height:0}
@media(max-width:1080px){main{grid-template-columns:1fr;height:auto;overflow:visible}
  .rightcol{grid-template-rows:auto auto;height:auto}
  #rows{width:100%}}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px}
.panel h3{display:none}   /* headings ate a row each; the content is self-evident */
.panel .body{padding:11px;overflow-y:auto;min-height:0}

/* ---------- board ---------- */
.boardwrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0}
/* Capped on both axes — the cells are 5:6, so the whole grid is 3:2 (w:h) and
   a height budget converts straight into a width cap. 100% is whatever the left
   column ended up being, so neither scrollbar can ever appear. */
#rows{display:flex;flex-direction:column;gap:4px;width:var(--boardw)}
.boardrow{width:100%}
.board{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:100%;min-width:0}

.cell{position:relative;aspect-ratio:5/6;padding:0;font:inherit;color:inherit;background:var(--chart);border:1px solid var(--rule-soft);
  border-radius:2px;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.cell .tick{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,var(--rule) 0 1px,transparent 1px) 50% 0/100% 5px no-repeat,
             linear-gradient(to bottom,var(--rule) 0 1px,transparent 1px) 0 50%/5px 100% no-repeat;opacity:.5}
.cell.regL{background:#2A3B32;border-color:#335044}
.cell.regR{background:#3C342A;border-color:#4C4232}
.cell.regM{background:var(--chart)}
.cell.zone{box-shadow:inset 0 0 0 1px rgba(220,228,232,.14)}
.cell.pick{cursor:pointer}
.cell.pick:hover{border-color:var(--verdigris)}
.cell.inrange{background:#2B4150;border-color:#3F5F6E}
.cell.legal{border-color:var(--verdigris);box-shadow:inset 0 0 0 1px rgba(87,160,142,.35)}
.cell.legal::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--verdigris);opacity:.6}
.cell.marked{border-color:var(--oxide);background:#3A2F35}
.cell.marked::after{content:attr(data-mark);font-family:var(--mono);font-size:10px;color:var(--oxide);
  position:absolute;top:2px;left:4px}
.cell.preview{background:#363B32;border-color:#586B4A}
.cell.dest{box-shadow:inset 0 0 0 2px var(--verdigris)}
.cell.burn{background:#3B2A22;border-color:#5A3829}
.flame{position:absolute;bottom:3px;right:4px;font-family:var(--mono);font-size:9px;color:var(--ember);letter-spacing:-.02em}

/* ---------- units ---------- */
.unit{position:absolute;inset:4px;border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:#16202880;border:1px solid var(--rule);
  font-size:13px;overflow:hidden}
.unit.L{border-color:var(--verdigris);background:linear-gradient(180deg,#2C4038,#24332E)}
.unit.R{border-color:var(--brass);background:linear-gradient(180deg,#43392A,#342E24)}
.unit.acted{opacity:1}
.unit.acted .done{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(9,13,17,.85);border:1px solid var(--verdigris);color:var(--verdigris);
  font-size:13px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.unit.R.acted .done{border-color:var(--brass);color:var(--brass)}
.unit.dead{display:none}
/* ---- board sprites ---- */
/* The art is its own layer under the label, with a scrim so the name and HP stay
   readable over any sprite. Absolutely positioned, so the token's own children
   need position:relative to paint above it. */
.unit .sp{position:absolute;inset:0;background-size:cover;background-position:center top;
  background-repeat:no-repeat;border-radius:1px;
  filter:saturate(1.06)}
.unit .sp::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,13,17,0) 0%,rgba(9,13,17,0) 62%,
             rgba(9,13,17,.35) 84%,rgba(9,13,17,.60) 100%)}
/* Sprite tokens fill their whole grid cell — no inset margin. */
.unit.has-sprite{inset:0;border-radius:2px;justify-content:flex-end;padding-bottom:3px}
/* Behind art, the side tint drops to a hint: the figure should read against a
   near-neutral field, and the token's border already says whose it is. */
.unit.has-sprite.L{background:linear-gradient(180deg,#35423F,#2B3733)}
.unit.has-sprite.R{background:linear-gradient(180deg,#42403A,#36332E)}
/* Only the label content needs lifting above the art. The corner badges (✓, 盾,
   gang number) are already absolute and sit after .sp in the DOM, so they paint
   above it on their own — including them here would strip their positioning. */
.unit.has-sprite .nm,.unit.has-sprite .hpbar,
.unit.has-sprite .hpn,.unit.has-sprite .pips{position:relative}
.unit.has-sprite .nm{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7)}
.unit.has-sprite .hpn{color:var(--text);text-shadow:0 1px 3px rgba(0,0,0,.95)}
.unit.has-sprite .hpbar{background:rgba(9,13,17,.75)}
.unit.place.has-sprite .nm{font-size:11px}
.unit .nm{font-weight:600;line-height:1.05;font-size:12px;text-align:center}
.unit .hpbar{width:78%;height:3px;background:#0d1418;border-radius:2px;overflow:hidden}
.unit .hpbar i{display:block;height:100%;background:var(--verdigris)}
.unit.R .hpbar i{background:var(--brass)}
.unit .hpbar i.hurt{background:var(--oxide)}
.unit .hpn{font-family:var(--mono);font-size:9px;color:var(--dim)}
/* Status badges (蛮王's 背水 rage). Bottom-left, opposite the acted ✓. */
.unit .st{position:absolute;bottom:2px;left:2px;min-width:16px;height:16px;padding:0 2px;
  border-radius:3px;background:rgba(9,13,17,.85);border:1px solid var(--oxide);color:var(--oxide);
  font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
/* Gang queue: the number this goblin acts on, top-left. */
.unit .qn{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--verdigris);color:#0b1417;font-size:10px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.unit.R .qn{background:var(--brass)}
.unit.queued{border-style:dashed}
/* The holy shield reads as protection, not alarm — steady, not pulsing. */
.unit.st-ward .st{border-color:#7FA6D8;color:#7FA6D8}
.unit.st-ward{box-shadow:0 0 0 2px rgba(127,166,216,.45),inset 0 0 12px rgba(127,166,216,.18)}
.unit.st-aegis .st{border-color:var(--verdigris);color:var(--verdigris)}
.unit.st-aegis{box-shadow:0 0 0 2px rgba(87,160,142,.55),inset 0 0 12px rgba(87,160,142,.22)}
.unit.st-rage{border-color:var(--oxide);animation:ragepulse 1.6s ease-in-out infinite}
@keyframes ragepulse{0%,100%{box-shadow:0 0 0 1px var(--oxide),0 0 6px rgba(180,74,52,.35)}
  50%{box-shadow:0 0 0 2px var(--oxide),0 0 16px rgba(180,74,52,.75)}}
.unit.sel{box-shadow:0 0 0 2px var(--verdigris),0 0 14px rgba(87,160,142,.3)}
.unit.pending{opacity:.62;border-style:dashed}
.cell.reachL{box-shadow:inset 0 0 0 2px rgba(87,160,142,.55)}
.cell.reachR{box-shadow:inset 0 0 0 2px rgba(201,154,62,.55)}
.unit{cursor:default}
.cell.movefrom{box-shadow:inset 0 0 0 1px var(--dimmer)}
.cell.movefrom::before{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;
  border:1px dashed var(--dimmer);border-radius:50%}
.unit.tgt{cursor:pointer;box-shadow:0 0 0 2px var(--oxide)}
.unit.clickable{cursor:pointer}
.unit.clickable:hover{filter:brightness(1.25)}
.pips{display:flex;gap:2px}
.pips i{width:3px;height:3px;border-radius:50%;background:var(--dimmer)}
.pips i.on{background:var(--brass)}

/* ---------- roster / force list ---------- */
.hero{border:1px solid var(--rule);border-radius:2px;padding:9px 11px;margin-bottom:7px;background:var(--panel-2)}
.hero.pickable{cursor:pointer}
.hero.pickable:hover{border-color:var(--verdigris)}
.hero.armed{border-color:var(--verdigris);box-shadow:inset 0 0 0 1px rgba(87,160,142,.4)}
.hero.used{opacity:.3;pointer-events:none}
.hero .top{display:flex;align-items:baseline;gap:7px}
.hero .cn{font-weight:600}
.hero .en{font-size:11px;color:var(--dim)}
.hero .stats{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.03em}
.hero .trait{font-size:11px;color:var(--dim);margin-top:5px;padding-left:8px;border-left:1px solid var(--rule)}
.hero .trait b{color:var(--text);font-weight:500}
.hero.pickable{cursor:grab}
.hero.pickable:active{cursor:grabbing}
.hero.dragging{opacity:.35}
.hero .grip{margin-left:auto;color:var(--dimmer);font-family:var(--mono);font-size:13px;line-height:1}
.hero .top{align-items:center}

/* ---------- deployment drag & drop ---------- */
body.placing .cell.zone{border-style:dashed;border-color:var(--verdigris)}
.cell.drop-ok{background:#1f2f2c !important;border-color:var(--verdigris) !important;
  box-shadow:inset 0 0 0 2px rgba(87,160,142,.55)}
.unit.place{cursor:grab;inset:3px}
.unit.place:active{cursor:grabbing}
.unit.place .rm{position:absolute;top:0;right:3px;font-size:11px;color:var(--oxide);opacity:0;transition:opacity .12s}
.unit.place:hover .rm{opacity:.95}
.dzHint{font-size:11px;color:var(--dim);margin:2px 0 12px;font-family:var(--mono);letter-spacing:.04em}

/* ---------- hero detail (right panel) ---------- */
.hd-name{font-size:20px;font-weight:600;line-height:1.15}
.hd-name .en{font-size:13px;color:var(--dim);font-weight:400;margin-left:9px}
.hd-hp{display:flex;align-items:center;gap:9px;margin:7px 0 0}
.hd-hp b{font-family:var(--mono);color:var(--text);font-size:14px;font-weight:600;flex:0 0 auto}
.hd-hp .bar{height:9px;background:#0d1418;border-radius:5px;overflow:hidden;flex:1 1 auto}
.hd-hp .bar i{display:block;height:100%;background:var(--verdigris);transition:width .2s}
.hd-hp.sideR .bar i{background:var(--brass)}
.hd-hp .bar i.hurt{background:var(--oxide)}
.hd-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:9px 0}
.hd-tile{background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;padding:4px 8px}
.hd-tile .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hd-tile .v{font-size:18px;font-weight:600;margin-top:1px;letter-spacing:.01em}
/* Live status (背水 rage): same shape as a trait, but in the alarm colour. */
.hd-status{border-left:2px solid var(--oxide);background:rgba(180,74,52,.10);border-radius:0 3px 3px 0;
  padding:6px 10px 6px 12px;margin:9px 0;font-size:14px;line-height:1.5;color:var(--text)}
.hd-status b{display:block;color:var(--oxide);font-weight:700;margin-bottom:4px;
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.hd-trait{border-left:2px solid var(--verdigris);padding:2px 0 2px 12px;margin:9px 0;
  font-size:15px;line-height:1.5;color:var(--text)}
.hd-trait b{display:block;color:var(--verdigris);font-weight:600;margin-bottom:2px;font-size:15px}

/* ---------- draft modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:20px;background:rgba(9,13,17,.72);backdrop-filter:blur(3px);
  animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.modal-h{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text);text-align:center}
.modal-sub{color:var(--dim);font-size:13px;text-align:center;margin:8px 0 20px}
.pair-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair-row .hero{margin:0}
.modal-h{margin-bottom:16px}
/* Cards are always the 5-across size; the modal shrinks to wrap fewer of them. */
.modal-wide{width:fit-content;max-width:95vw}
.offer-grid{display:flex;justify-content:center;gap:8px;margin-top:4px;
  --card:calc((min(1560px,95vw) - 80px)/5)}
.offer-grid .hero{margin:0;width:var(--card);flex:0 0 auto}
.offer-grid .hero.pickable{cursor:pointer}
.offer-grid .hero.pickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.draft-card{position:relative;aspect-ratio:3/4;padding:0;overflow:hidden;
  background-size:cover;background-position:center top}
.draft-card .dc-body{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 16px}
.draft-card.has-img .dc-body{background:linear-gradient(transparent,rgba(9,13,17,.55) 35%,rgba(9,13,17,.95))}
.dc-name{font-size:23px;font-weight:600;line-height:1.15;margin-bottom:8px}
.dc-desc{font-size:13px;line-height:1.55;color:var(--dim)}
.draft-card.has-img .dc-desc{color:var(--text)}
.modal-wait{text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;margin-top:18px}
.modal-taken{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;
  padding-top:16px;border-top:1px solid var(--rule)}
@media(max-width:520px){.pair-row{grid-template-columns:1fr}}

/* ---------- resolution reveal ---------- */
.reveal-back{z-index:60;cursor:pointer}
/* An explicit width, not just a cap: the box is a flex item and the portraits
   are background-image divs with no intrinsic size, so shrink-to-fit would size
   the whole screen off the text and the portrait cap would never apply. */
.reveal-box{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
  width:min(1050px,96vw);max-width:96vw;
  padding:34px 39px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.reveal-box .modal-h{font-size:16px;margin-bottom:21px}
.rv-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:36px;margin-top:23px}
.rv-vs{font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--dim)}
.rv-side{text-align:center}
/* Capped by screen height too (3:4 portrait ⇒ height = width × 4/3), so a big
   monitor gets a big portrait and a laptop still fits the whole card. */
.rv-img{aspect-ratio:3/4;width:100%;max-width:min(448px,35vh);margin:0 auto;border-radius:4px;
  background:var(--panel-2);background-size:cover;background-position:center top;border:1px solid var(--rule)}
.rv-side.sideL .rv-img.has-img{border-color:var(--verdigris)}
.rv-side.sideR .rv-img.has-img{border-color:var(--brass)}
.rv-name{font-size:34px;font-weight:600;margin-top:18px}
.rv-crew{font-size:18px;color:var(--dim);margin-top:6px}
.rv-ability{font-size:22px;font-weight:600;color:var(--verdigris);margin-bottom:6px}
.rv-side.sideR .rv-ability{color:var(--brass)}
.rv-note{font-size:17px;line-height:1.45;color:var(--dim);margin-top:4px}
.rv-order{margin-top:13px}
.rv-hit{font-size:25px;line-height:1.5;color:var(--text)}
.rv-hit b{color:var(--oxide);font-weight:700}
.rv-none{color:var(--dim);font-size:21px}
.rv-hint{text-align:center;font-family:var(--mono);font-size:13px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dimmer);margin-top:21px}

/* ---------- order slip: the signature ---------- */
.slip{background:#F0EBE1;color:#1a1a1a;border-radius:2px;position:relative;
  font-family:var(--mono);font-size:11px;padding:16px 14px 14px;
  box-shadow:0 6px 18px rgba(0,0,0,.4)}
.slip::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,transparent 0 5px,var(--ink) 5px 6px);opacity:.25}
.slip .hdr{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid #b9b2a4;padding-bottom:6px;margin-bottom:9px;
  letter-spacing:.16em;text-transform:uppercase;font-size:9px;color:#6b6355}
.slip .fld{display:flex;gap:8px;padding:4px 0;border-bottom:1px dotted #c8c1b3}
.slip .fld:last-child{border-bottom:none}
.slip .k{width:60px;color:#6b6355;text-transform:uppercase;font-size:9px;letter-spacing:.1em;padding-top:1px}
.slip .v{flex:1;color:#1a1a1a}
.slip .v.blank{color:#a89f8f}
.slip.sealed{background:#2A3038;color:var(--dim)}
.slip.sealed .stamp{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--verdigris);
  text-align:center;padding:4px 0 12px}
/* The sealed slip keeps its fields, so recolour them for the dark stock. */
.slip.sealed .hdr{border-bottom-color:#3d4854;color:var(--dim)}
.slip.sealed .hdr:not(:first-of-type){margin-top:14px}
.slip.sealed .fld{border-bottom-color:#39434d}
.slip.sealed .k{color:var(--dimmer)}
.slip.sealed .v{color:var(--text)}
.slip.sealed .v.blank{color:var(--dimmer)}
.slip.R .stamp{color:var(--brass)}

.flip{animation:flip .5s ease-out}
@keyframes flip{from{transform:rotateX(-88deg);opacity:.2}to{transform:rotateX(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.flip{animation:none}}

/* ---------- controls ---------- */
.btn{display:block;width:100%;text-align:left;padding:8px 11px;margin-bottom:6px;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel-2);transition:border-color .12s}
.btn:hover:not(:disabled){border-color:var(--verdigris)}
.btn.on{border-color:var(--verdigris);background:#1f2f2c}
.btn .cost{float:right;font-family:var(--mono);font-size:10px;color:var(--brass)}
.btn small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.primary{background:var(--verdigris);color:#0d1a17;border-color:var(--verdigris);
  text-align:center;font-weight:600;letter-spacing:.04em}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.ghost{text-align:center;color:var(--dim)}

.note{font-size:12px;color:var(--dim);margin:0 0 7px;line-height:1.45}
.btn small.blocked{color:var(--oxide)}
